<!doctype html>
<!--
  Chrome 应用商店小宣传图（440×280）源文件。商店里全语言共用一张，只做英文。
  导出 PNG：node scripts/render-promo.mjs（见 docs/store/LISTING.md「素材」）
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MarkFlow promo tile</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 26px;
        padding: 0 34px;
        background:
          radial-gradient(260px 200px at 22% 50%, rgb(29 155 240 / 0.16), transparent 70%),
          #0b0d10;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .icon {
        flex: none;
        width: 120px;
        height: 120px;
        border-radius: 26px;
        overflow: hidden;
        box-shadow:
          0 0 0 1.5px rgb(255 255 255 / 0.22),
          0 12px 32px rgb(0 0 0 / 0.6);
      }
      /* icon-128.png 四周有 8/128 的透明边，放大后裁掉，与侧边栏 Logo 同法 */
      .icon img {
        display: block;
        width: 137px;
        height: 137px;
        margin: -8.5px;
      }
      .text {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .pill {
        align-self: flex-start;
        padding: 3px 10px;
        border-radius: 999px;
        background: #1d9bf0;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      h1 {
        font-size: 34px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      .tagline {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
      }
      .sub {
        font-size: 13px;
        color: rgb(255 255 255 / 0.62);
      }
    </style>
  </head>
  <body>
    <div class="icon"><img src="../../../public/icon-128.png" alt="" /></div>
    <div class="text">
      <span class="pill">MARKDOWN → X</span>
      <h1>MarkFlow</h1>
      <p class="tagline">Markdown into X articles, formatting intact</p>
      <p class="sub">Runs locally · Never auto-publishes</p>
    </div>
  </body>
</html>
